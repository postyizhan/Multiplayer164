buildscript {
    repositories {
        // Local copy of the Voldeloom plugin (its upstream repo.sleeping.town is
        // unreachable from this environment). The jar+pom live in libs/voldeloom-repo.
        maven { url "${rootDir}/libs/voldeloom-repo" }
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven { url "https://maven.fabricmc.net" }
    }
    dependencies {
        classpath "agency.highlysuspect:voldeloom:2.4-SNAPSHOT"
    }
}
plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

apply plugin: 'agency.highlysuspect.voldeloom'

sourceCompatibility = '1.7'
targetCompatibility = '1.7'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

version = "1.0.0"
group = "com.github.postyizhan.multiplayer164"
archivesBaseName = "Multiplayer164"

repositories {
    // repo.maven.apache.org returns 403 in this environment; use reachable mirrors.
    maven { url "https://maven.aliyun.com/repository/public/" }
    maven { url "https://repo1.maven.org/maven2/" }
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:1.6.4"
    forge "net.minecraftforge:forge:1.6.4-9.11.1.1345:universal"
    mappings "net.minecraftforge:forge:1.6.4-9.11.1.1345:src@zip"

    // Multiplayer (Terracotta) support — bundled into the final jar via `shade`.
    // Pure-Java, Java 7 compatible, no native code.
    shade "com.google.code.gson:gson:2.8.9"
    // commons-compress removed: it is a Java 8 multi-release jar (module-info.class)
    // that the 1.6.4 remapper (ASM4) cannot process. tar.gz is handled with a
    // small hand-written tar reader + JDK GZIPInputStream instead.

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.google.code.gson:gson:2.8.9"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    configurations.shade.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
    classifier = 'universal'
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    configurations.shade.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
    classifier = 'dev'
}
